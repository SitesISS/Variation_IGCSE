.opt.wrong { border-color: var(--bad); background: var(--bad-bg); } .opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); } .opt.wrong .mark { color: var(--bad); }

<script>
/* ===== Walk-through content: variation (IGCSE Biology 0610, Year 11) ===== */
const SECTIONS = [
 {
  "id": "s1",
  "title": "What is variation?",
  "teach": "\n<p><b>Variation</b> is the <b>differences between individuals of the same species</b>.</p>\n<p><b>Phenotypic variation</b> is the difference in <b>features</b> (characteristics) between individuals of the same species, for example height, eye colour or blood group.</p>\n<p>Some of these differences are caused by differences in <b>genes</b>. This is called <b>genetic variation</b>.</p>\n<p class=\"examtip\"><b>Remember:</b> variation is always about the <b>same species</b>. A cat and a dog being different is not variation in this sense.</p>",
  "checks": [
   {
    "id": "c1",
    "q": "Which of these is an example of variation?",
    "o": [
     "Students in a class have different heights",
     "A lion is much larger than a house cat",
     "A rose plant is a different colour from a tulip",
     "A shark lives in water and a horse on land"
    ],
    "a": 0,
    "w": {
     "1": "Lions and house cats are different species. Variation is about differences within one species.",
     "2": "Roses and tulips are different species, so this isn't variation within a species.",
     "3": "Sharks and horses are different species. Variation compares individuals of the same species."
    },
    "x": "All the students belong to one species, humans, so their different heights are variation.",
    "b": [
     {
      "q": "What is variation?",
      "o": [
       "Differences within one species",
       "Differences between different species",
       "Changes in an organism as it grows up",
       "The number of species in a habitat"
      ],
      "a": 0,
      "x": "Variation compares individuals of the same species."
     },
     {
      "q": "Which pair belongs to the same species?",
      "o": [
       "Two people with different eyes",
       "A dog and a wolf in the same zoo",
       "A horse and a donkey on a farm",
       "A frog and a toad in the same pond"
      ],
      "a": 0,
      "x": "All humans are one species, so differences between them count as variation."
     }
    ]
   },
   {
    "id": "c2",
    "q": "What is meant by 'phenotypic variation'?",
    "o": [
     "Differences in features between individuals of a species",
     "Differences between the species living in one habitat",
     "Changes in the size of a population over time",
     "The process of passing genes from parents to offspring"
    ],
    "a": 0,
    "w": {
     "1": "Phenotypic variation is within one species, not between species.",
     "2": "That's population change. Phenotypic variation is about features of individuals.",
     "3": "That's inheritance. Phenotypic variation is about the features individuals end up with."
    },
    "x": "The phenotype is an organism's features. Phenotypic variation is how those features differ between individuals of the same species.",
    "b": [
     {
      "q": "What does 'phenotype' mean?",
      "o": [
       "An organism's observable features",
       "The number of chromosomes in a cell",
       "The habitat an organism lives in",
       "The food an organism eats"
      ],
      "a": 0,
      "x": "Phenotype = the features you can observe or measure, such as height or blood group."
     },
     {
      "q": "What is genetic variation?",
      "o": [
       "Differences caused by genes",
       "Differences caused only by diet",
       "Differences caused by accidents",
       "Differences between different species"
      ],
      "a": 0,
      "x": "Genetic variation is caused by differences in genes between individuals."
     }
    ]
   }
  ]
 },
 {
  "id": "s2",
  "title": "Continuous and discontinuous",
  "teach": "\n<p>Phenotypic variation can be divided into two types, depending on how the measurements can be grouped.</p>\n<div class=\"two\">\n  <div class=\"tile\"><h4>Continuous variation</h4><p>There are <b>very many small degrees of difference</b> between individuals. They can be arranged in order and usually <b>measured on a scale</b>, with lots of \"in-between\" values.</p><p><b>Examples:</b> height, mass, finger length.</p></div>\n  <div class=\"tile\"><h4>Discontinuous variation</h4><p>There are <b>distinct categories</b>, with <b>no in-betweens</b>.</p><p><b>Examples:</b> blood group (A, B, AB or O), biological sex (male or female), whether you can roll your tongue or not.</p></div>\n</div>\n<p class=\"examtip\"><b>Quick test:</b> can someone be \"in between\"? If yes, it's continuous. If you are in one group or another, it's discontinuous.</p>",
  "checks": [
   {
    "id": "c3",
    "q": "Which of these shows discontinuous variation?",
    "o": [
     "Blood group",
     "Height",
     "Body mass",
     "Finger length"
    ],
    "a": 0,
    "w": {

    },
    "x": "Everyone is blood group A, B, AB or O. There are no in-between groups, so it's discontinuous variation.",
    "b": [
     {
      "q": "What is special about discontinuous variation?",

      ],

      "x": "Discontinuous: you're in one category or another."

    ]
   },
   {
    "id": "c4",

    "o": [

     "Discontinuous, as all leaves on one tree are identical",

    ],

    "w": {

/* ===== Diagrams ===== */
const F = {};

function barChart(o) {
  const W = 600, H = o.rotate ? 350 : 330, L = 64, R = 14, T = 16, B = o.rotate ? 92 : 70;
  const pw = W - L - R, ph = H - T - B, n = o.bars.length;
  const slot = pw / n, bw = o.touch ? slot : slot * 0.62;
  const sy = v => T + ph - v / o.ymax * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">`;
  o.yticks.forEach(t => { s += `<line class="grid" x1="${L}" y1="${sy(t)}" x2="${L + pw}" y2="${sy(t)}"/><text class="num" x="${L - 8}" y="${sy(t) + 4}" text-anchor="end">${t}</text>`; });
  o.bars.forEach(([lab, v], i) => {
    const x = L + i * slot + (slot - bw) / 2;
    s += `<rect class="bar ${o.cls}" x="${x.toFixed(1)}" y="${sy(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ph - sy(v)).toFixed(1)}"/>`;
    if (o.values) s += `<text class="num b" x="${(x + bw / 2).toFixed(1)}" y="${(sy(v) - 6).toFixed(1)}" text-anchor="middle">${v}%</text>`;
    s += `<text class="${o.rotate ? "num tick-r" : "lbl"}" ${o.rotate ? `transform="translate(${(x + bw / 2).toFixed(1)} ${T + ph + 12}) rotate(-40)" text-anchor="end"` : `x="${(x + bw / 2).toFixed(1)}" y="${T + ph + 24}" text-anchor="middle"`}>${lab}</text>`;
  });
  if (o.curve) {
    const mu = o.curve.mu, sd = o.curve.sd, pk = o.curve.peak; let d = "";
    for (let k = 0; k <= 120; k++) { const t = -0.5 + (n) * k / 120; const v = pk * Math.exp(-((t - mu) ** 2) / (2 * sd * sd)); const x = L + (t + 0.5) * slot; d += (k ? " L " : "M ") + x.toFixed(1) + " " + sy(v).toFixed(1); }
    s += `<path class="bell" d="${d}"/>`;
  }
  s += `<line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${T + ph}"/><line class="axis" x1="${L}" y1="${T + ph}" x2="${L + pw}" y2="${T + ph}"/>`;
  s += `<text class="axis-t" x="${L + pw / 2}" y="${H - 6}" text-anchor="middle">${o.xlabel}</text>`;
  s += `<text class="axis-t" transform="translate(16 ${T + ph / 2}) rotate(-90)" text-anchor="middle">${o.ylabel}</text></svg>`;
  return s;
}

  xlabel: "Height / cm", ylabel: "Number of people",
  aria: "Histogram of heights from up to 129 cm to over 175 cm. Bars touch. The numbers rise to a peak at 150 to 159 cm and then fall, forming a smooth bell-shaped curve.",
  bars: [["≤129", 2], ["130–134", 4], ["135–139", 8], ["140–144", 14], ["145–149", 21], ["150–154", 26], ["155–159", 25], ["160–164", 19], ["165–169", 12], ["170–174", 6], ["≥175", 3]] })}
  <figcaption>Height is continuous variation: a smooth, bell-shaped curve. Most people are near the middle.</figcaption></figure>`;

F.blood = () => `<figure class="fig">${barChart({ touch: false, values: true, cls: "b-disc", ymax: 50, yticks: [0, 10, 20, 30, 40, 50],
  xlabel: "Blood group", ylabel: "Percentage of population",
  aria: "Bar chart of blood groups with gaps between bars: A 40%, B 9%, AB 3%, O 46%.",
  bars: [["A", 40], ["B", 9], ["AB", 3], ["O", 46]] })}
  <figcaption>Blood group is discontinuous variation: separate categories give a step-like bar chart.</figcaption></figure>`;

F.ears = () => `<figure class="fig"><svg viewBox="0 0 600 250" role="img" aria-label="Two ears. Left: a free ear lobe that hangs down below where the ear joins the head. Right: an attached ear lobe that joins straight onto the side of the head.">
  <line class="head" x1="150" y1="20" x2="150" y2="220"/><line class="head" x1="430" y1="20" x2="430" y2="220"/>

  <path class="ear" d="M 430 50 C 390 20, 340 40, 342 95 C 344 140, 372 160, 390 182 C 404 198, 420 200, 430 192"/>

  <text class="cap" x="150" y="14" text-anchor="middle">side of head</text><text class="cap" x="430" y="14" text-anchor="middle">side of head</text>
</svg><figcaption>Free or attached ear lobes: an example of genetic, discontinuous variation.</figcaption></figure>`;

F.gxe = () => `<figure class="fig"><div class="chain">
  <div class="part"><b>Genes from parents</b><span>set the potential height</span></div><i>+</i>
  <div class="part"><b>Environment</b><span>diet, health, exercise</span></div><i>=</i>
  <div class="part out"><b>Actual height</b><span>how the potential develops</span></div>
</div><figcaption>Continuous features usually depend on both genes and environment.</figcaption></figure>`;

F.sources = () => `<figure class="fig"><div class="src4">
  <div class="tile new"><h4>Mutation</h4><p>Random changes to the base sequence of DNA. Forms <b>new alleles</b>.</p></div>
  <div class="tile"><h4>Meiosis</h4><p>Makes gametes with new combinations of alleles.</p></div>
  <div class="tile"><h4>Random mating</h4><p>Which individuals pair up for sexual reproduction is down to chance.</p></div>
  <div class="tile"><h4>Random fertilisation</h4><p>Which sperm fuses with which egg is down to chance.</p></div>
</div><figcaption>Only mutation makes new alleles. The other three shuffle existing alleles into new combinations.</figcaption></figure>`;

F.sort = () => `<figure class="fig"><div class="tblwrap"><table class="st">
  <thead><tr><th>Feature</th><th>Continuous or discontinuous?</th><th>Cause</th></tr></thead>
  <tbody>
    <tr><td>Blood group</td><td>Discontinuous</td><td>Genetic</td></tr>
    <tr><td>Tongue rolling</td><td>Discontinuous</td><td>Genetic</td></tr>
    <tr><td>Height</td><td>Continuous</td><td>Genes + environment</td></tr>
    <tr><td>Body mass</td><td>Continuous</td><td>Genes + environment</td></tr>
    <tr><td>A scar</td><td>–</td><td>Environmental</td></tr>
    <tr><td>Accent</td><td>–</td><td>Environmental</td></tr>
  </tbody></table></div><figcaption>A quick way to organise your answer.</figcaption></figure>`;

/* ===== Walk-through engine ===== */
const KEY = "igcse-bio-variation-walkthrough-v1";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LET = "ABCD";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const CHECKS = SECTIONS.flatMap(s => s.checks);

let P = { sec: 0, res: {} };           // saved progress
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

/* Balanced answer positions: each letter is correct equally often, never 3 times running. */
const bags = { main: [], back: [] }, hist = { main: [], back: [] };
function deal(name, n, allowed) {
  const bag = bags[name], h = hist[name];
  const ok = t => t < n && (!allowed || allowed.includes(t)) && !(h.length >= 2 && h[h.length - 1] === t && h[h.length - 2] === t);
  let k = -1;
  for (let tries = 0; tries < 3 && k < 0; tries++) { for (let j = bag.length - 1; j >= 0; j--) if (ok(bag[j])) { k = j; break; } if (k < 0) bag.unshift(...shuffle([0, 1, 2, 3])); }
  const t = k >= 0 ? bag.splice(k, 1)[0] : (allowed ? allowed[0] : 0); h.push(t); return t;
}
function orderFor(n, correct, t, fixed) {
  const idx = [...Array(n).keys()];
  if (fixed) { const desc = idx.slice().reverse(); if (n - 1 - correct === t) return desc; if (correct === t) return idx; return Math.random() < .5 ? idx : desc; }
  const rest = shuffle(idx.filter(i => i !== correct)); rest.splice(t, 0, correct); return rest;
}
function order(q, bag) { return orderFor(q.o.length, q.a, deal(bag, q.o.length, q.fixed ? [q.a, q.o.length - 1 - q.a] : null), q.fixed); }

/* Live state of the current check */
let R = null;
const sectionDone = i => SECTIONS[i].checks.every(c => P.res[c.id]);
const unlocked = () => { let i = 0; while (i < SECTIONS.length && sectionDone(i)) i++; return i; }; // first unfinished section

function renderChips() {
  const u = unlocked();
  $("#chips").innerHTML = SECTIONS.map((s, i) => `<button type="button" data-i="${i}" class="${sectionDone(i) ? "done" : ""}" ${P.sec === i ? 'aria-current="step"' : ""} ${i > u ? "disabled title=\"Finish the earlier sections first\"" : ""}><span class="n">${sectionDone(i) ? "✓" : i + 1}</span>${esc(s.title)}${s.ext ? '<span class="ext">Ext</span>' : ""}</button>`).join("")
    + `<button type="button" data-i="end" ${P.sec === "end" ? 'aria-current="step"' : ""} ${u < SECTIONS.length ? "disabled" : ""}><span class="n">★</span>Summary</button>`;
  $("#chips").querySelectorAll("button").forEach(b => b.addEventListener("click", () => goSection(b.dataset.i === "end" ? "end" : +b.dataset.i)));
  const cur = $("#chips").querySelector('[aria-current="step"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function goSection(i) { P.sec = i; save(); R = null; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }

function fillFigs(html) { return html.replace(/\{\{FIG:(\w+)\}\}/g, (m, k) => F[k] ? F[k]() : ""); }

function render() {
  renderChips();
  if (P.sec === "end") return renderEnd();
  if (P.sec > unlocked()) P.sec = unlocked();
  const s = SECTIONS[P.sec];
  const done = s.checks.filter(c => P.res[c.id]);
  const next = s.checks.find(c => !P.res[c.id]);
  $("#main").innerHTML = `
    <section class="card"><div class="eyebrow">Section ${P.sec + 1} of ${SECTIONS.length}</div><h2>${esc(s.title)}${s.ext ? '<span class="ext">Extended</span>' : ""}</h2><div class="notes">${fillFigs(s.teach)}</div></section>
    <section class="card check" id="checkcard">
      ${done.length ? `<div class="passed">${done.map(c => `<div><span class="tag ${P.res[c.id]}">${P.res[c.id] === "first" ? "First try" : P.res[c.id] === "help" ? "After help" : "Revisit"}</span><span>${esc(c.q)}</span></div>`).join("")}</div>` : ""}
      <div id="qzone"></div>
    </section>`;
  wireFig();
  if (next) startCheck(next);
  else finishSection();
}

function wireFig() {
  const fig = $("#inhib-fig"); if (!fig) return;
  const show = { normal: true, comp: false, nonc: false };
  const apply = () => { fig.querySelectorAll("[data-curve]").forEach(g => g.classList.toggle("off", !show[g.dataset.curve])); fig.querySelectorAll(".tog").forEach(b => { b.classList.toggle("on", show[b.dataset.show]); b.setAttribute("aria-pressed", show[b.dataset.show]); }); };
  fig.querySelectorAll(".tog[data-show]").forEach(b => b.addEventListener("click", () => { if (b.dataset.show !== "normal") { show[b.dataset.show] = !show[b.dataset.show]; apply(); } }));
  apply();
}

function startCheck(c) {
  R = { c, phase: "main", bi: 0, first: null, order: order(c, "main"), bOrder: null };
  drawQ(); clearLog();
}

function curQ() { return R.phase === "back" ? R.c.b[R.bi] : R.c; }
function curOrder() { return R.phase === "back" ? R.bOrder : R.order; }

function drawQ() {
  const c = R.c, s = SECTIONS[P.sec], q = curQ(), ord = curOrder();
  const idx = s.checks.indexOf(c) + 1;
  let label, cls = "";
  if (R.phase === "main") label = `Check ${idx} of ${s.checks.length}`;
  else if (R.phase === "back") { label = `Back-up question ${R.bi + 1} of ${c.b.length}`; cls = "backup"; }
  else { label = `Second try · Check ${idx}`; cls = "retry"; }
  const trail = R.phase === "main" ? "" : `<div class="trail"><b class="done">Check</b>${c.b.map((_, k) => `<i>→</i><b class="${R.phase === "back" && R.bi === k ? "on" : (R.phase === "retry" || R.bi > k ? "done" : "")}">Back-up ${k + 1}</b>`).join("")}<i>→</i><b class="${R.phase === "retry" ? "on" : ""}">Second try</b></div>`;
  $("#qzone").innerHTML = `
    <div class="qhead"><span class="stage ${cls}">${label}</span></div>${trail}
    ${q.fig ? F[q.fig]() : ""}
    <p class="stem">${esc(q.q)}</p>
    <div class="opts" id="opts">${ord.map((oi, pos) => `<button type="button" class="opt" data-oi="${oi}" id="opt-${pos}"><span class="k">${LET[pos]}</span><span>${esc(q.o[oi])}</span><span class="mark"></span></button>`).join("")}</div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="actions" id="actions"></div>`;
  $("#opts").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.oi)));
}
function clearLog() { const l = $("#log"); if (l) l.innerHTML = ""; }
function letter(oi) { return LET[curOrder().indexOf(oi)]; }
function lock(chosen, correct, reveal) {
  $("#opts").querySelectorAll(".opt").forEach(b => {
    const oi = +b.dataset.oi; b.disabled = true;
    if (oi === chosen && chosen === correct) { b.classList.add("right"); b.querySelector(".mark").textContent = "Correct"; }
    else if (oi === chosen) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "Your answer"; }
    else if (oi === correct && reveal) { b.classList.add("right"); b.querySelector(".mark").textContent = "Answer"; }
    else b.classList.add("dim");
  });
}
function msg(kind, title, text) {
  const d = document.createElement("div"); d.className = "msg " + kind;
  d.innerHTML = (title ? `<h3>${esc(title)}</h3>` : "") + `<p>${esc(text)}</p>`;
  $("#log").appendChild(d);
}
function actions(list) {
  const a = $("#actions"); a.innerHTML = "";
  list.forEach((it, k) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); a.appendChild(b); if (k === 0) setTimeout(() => { b.focus({ preventScroll: true }); b.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); }, 0); });
}

function choose(oi) {
  const c = R.c, q = curQ();
  if (R.phase === "back") {
    const ok = oi === q.a; lock(oi, q.a, true);
    msg(ok ? "good" : "bad", ok ? "Correct" : `The answer is ${letter(q.a)}`, q.x);
    const last = R.bi === c.b.length - 1;
    actions([{ label: last ? "Try the check question again" : "Next back-up question", go: () => {
      if (last) { R.phase = "retry"; const was = R.order.indexOf(c.a); if (c.fixed) { const f = R.order.slice().reverse(); if (f.indexOf(c.a) !== was) R.order = f; } else { const t = shuffle([0, 1, 2, 3].filter(p => p !== was))[0]; R.order = orderFor(4, c.a, t, false); } drawQ(); msg("hint", "Second try", "The options are in a new order, so read them carefully."); }
      else { R.bi++; R.bOrder = order(c.b[R.bi], "back"); drawQ(); }
      focusFirst();
    } }]);
    return;
  }
  const ok = oi === c.a;
  if (R.phase === "main") {
    if (ok) { lock(oi, c.a, false); msg("good", "Correct", c.x); record("first"); }
    else {
      lock(oi, c.a, false); R.first = oi;
      msg("bad", `Not quite: ${letter(oi)} isn't right`, c.w[oi] || "That isn't the right answer.");
      msg("hint", "Let's check the basics", `Answer ${c.b.length} short back-up questions, then try this one again. Re-read the notes above if you need to.`);
      actions([{ label: "Start the back-up questions", go: () => { R.phase = "back"; R.bi = 0; R.bOrder = order(c.b[0], "back"); drawQ(); focusFirst(); } }]);
    }
    return;
  }
  lock(oi, c.a, true);
  if (ok) { msg("good", "Got it on the second try", c.x); record("help"); }
  else { msg("bad", `Not this time. The answer is ${letter(c.a)}`, (c.w[oi] ? c.w[oi] + " " : "") + c.x); record("miss"); }
}
function focusFirst() { const b = $("#opt-0"); if (b) { b.focus({ preventScroll: true }); $("#qzone").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }); } }

function record(result) {
  P.res[R.c.id] = result; save(); renderChips();
  const s = SECTIONS[P.sec], next = s.checks.find(c => !P.res[c.id]);
  if (next) actions([{ label: "Next check question", go: () => { render(); setTimeout(() => $("#checkcard").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }), 0); } }]);
  else actions(sectionNav());
}
function sectionNav() {
  const last = P.sec === SECTIONS.length - 1;
  return [{ label: last ? "See your summary" : `Next section: ${SECTIONS[P.sec + 1].title}`, go: () => goSection(last ? "end" : P.sec + 1) }];
}
function finishSection() {
  const s = SECTIONS[P.sec];
  $("#qzone").innerHTML = `<p>You've finished this section's checks.</p><div class="actions" id="actions"></div>`;
  const a = sectionNav().concat([{ label: "Redo this section's questions", ghost: true, go: () => { s.checks.forEach(c => delete P.res[c.id]); save(); render(); } }]);
  const box = $("#actions");
  a.forEach(it => { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); box.appendChild(b); });
}

function renderEnd() {
  const n = CHECKS.length, c = { first: 0, help: 0, miss: 0 };
  CHECKS.forEach(k => { if (P.res[k.id]) c[P.res[k.id]]++; });
  const pts = c.first + c.help * 0.5;
  const fmt = v => (v % 1 ? Math.floor(v) + "½" : String(v));
  $("#main").innerHTML = `
    <section class="card"><div class="eyebrow">Summary</div>
      <div class="big">${fmt(pts)}<small> / ${n} checks</small></div>
      <p>${c.first} right first time · ${c.help} right after the back-up questions · ${c.miss} to revisit</p>
      <div class="secs">${SECTIONS.map((s, i) => { const r = s.checks.map(k => P.res[k.id]); const worst = r.includes("miss") ? "miss" : r.includes("help") ? "help" : "first";
        return `<div class="row"><span><span class="tag ${worst}">${worst === "first" ? "Secure" : worst === "help" ? "Getting there" : "Revisit"}</span> ${esc(s.title)}</span><button type="button" class="linkbtn" data-go="${i}">Go to section</button></div>`; }).join("")}</div>
    </section>
    <section class="card"><h2>Key points</h2><ol class="keys">${SUMMARY.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      <div class="actions"><button type="button" class="btn ghost" id="restart">Start again from the beginning</button><span id="confirm" class="note"></span></div></section>`;
  $("#main").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => goSection(+b.dataset.go)));
  let armed = false;
  $("#restart").addEventListener("click", () => {
    if (!armed) { armed = true; $("#confirm").textContent = "This clears your answers. Click again to confirm."; setTimeout(() => { armed = false; const el = $("#confirm"); if (el) el.textContent = ""; }, 5000); return; }
    P = { sec: 0, res: {} }; save(); goSection(0);
  });
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !R) return;
  const i = "ABCD".indexOf(e.key.toUpperCase()); const j = i >= 0 ? i : "1234".indexOf(e.key);
  if (j >= 0 && e.key.length === 1) { const b = $("#opt-" + j); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});

render();

</script>
</body>
